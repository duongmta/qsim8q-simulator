[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsim8-unified"
version = "3.0.0"
description = "QSim8Q HLS core, local C++ simulator and Qiskit BackendV2 research package"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0,<2.8",
    "qiskit>=2,<3",
    "qiskit-aer>=0.17,<1",
    "pyserial==3.5",
    "pydantic>=2.8,<3",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["qsim8_backend"]

name: Windows simulator tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check environment
        run: python -m qsim8_backend.launch --check-env
      - name: Unit and protocol tests
        run: python -m pytest -q tests
      - name: Bell and GHZ8 examples
        shell: pwsh
        run: |
          python -m examples.local_core_demo --circuit bell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m examples.local_core_demo --circuit ghz8
          exit $LASTEXITCODE
      - name: Full local validation
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          python experiments/cd3_python_core/run_cd3.py
          exit $LASTEXITCODE
